openapi: 3.1.3

info:
  title: BFF Móvil — Sesión
  summary: API del canal móvil para iniciar y refrescar la sesión de los clientes de Solventa.
  description: |
    Backend for Frontend del cliente móvil.

    Alcance de esta versión (`0.1.x`): **sesión** — inicio de sesión con correo y
    contraseña y refresco del token de acceso — y el **paso previo a cotizar**: las
    hipotecas del cliente y los bancos del mercado. Mismos endpoints y mismo contrato
    que el canal web; el resto del journey se agrega en versiones posteriores. Incluye la
    **cotización activa** del cliente (`POST` y `GET /v1/cotizaciones`): una por cliente, y una
    nueva reemplaza a la anterior.

    Entrada real: `App móvil → Cloud LB → Cloud Armor (WAF) → API Gateway → BFF Móvil`.

    **Sesión propia.** El BFF móvil emite su propio JWT de sesión, firmado con un
    secreto distinto al del BFF web: un token emitido por un canal no vale en el otro.

    Errores en formato **RFC 9457 (Problem Details)**, `application/problem+json`.
  version: 0.1.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico 4Bits

servers:
  - url: https://dev.solventa4bits.com/mobile
    description: Entorno de desarrollo

tags:
  - name: Sesión
    description: Inicio de sesión y refresco de token.
  - name: Cotización
    description: Paso previo a cotizar el seguro de vida sobre crédito hipotecario.

security: []

paths:
  /v1/sesiones:
    post:
      operationId: iniciarSesion
      tags: [Sesión]
      summary: Inicia sesión con correo y contraseña
      description: |
        **Público** (no requiere token).

        1. Valida las credenciales en Identity Platform.
        2. Busca al cliente en CoreTransaccional por su identidad.
        3. Emite la sesión (token de acceso y de refresco).

        Responde `401` si las credenciales no son válidas y `404` si la identidad
        existe pero no tiene un cliente registrado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredencialesRequest' }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/sesiones/refresco:
    post:
      operationId: refrescarSesion
      tags: [Sesión]
      summary: Refresca el token de acceso
      description: |
        **Público** (no requiere token de acceso; se autentica con el `refreshToken`).
        Valida el token de refresco y emite una sesión nueva, sin consultar a ningún
        otro servicio. Responde `401` si el token está expirado, es inválido o no es
        un token de refresco.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefrescoRequest' }
      responses:
        '200':
          description: Sesión nueva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/creditos-hipotecarios:
    get:
      operationId: obtenerCreditosHipotecarios
      tags: [Cotización]
      summary: Hipotecas del cliente y bancos del mercado, para empezar una cotización
      description: |
        Paso previo a cotizar. Devuelve las hipotecas abiertas del cliente que
        Perfilamiento ya trajo de Open Finance cuando el cliente dio su consentimiento
        (no se consulta a la fuente en esta llamada), junto con la lista de bancos del
        mercado. El cliente elige un banco y rellena el formulario con los datos de esa
        hipoteca sin volver a llamar al backend; si no hay datos, escribe los suyos.

        `estado` dice qué mostrar:
        - `DISPONIBLE`: hay hipotecas en `creditos`; el cliente elige una.
        - `SIN_HIPOTECAS`: la fuente respondió y no hay ninguna abierta; captura manual.
        - `SIN_CONSENTIMIENTO`: el cliente no autorizó Open Finance; captura manual.
        - `NO_DISPONIBLE`: no hay datos vigentes y la fuente no respondió; el cliente
          puede reintentar o escribir los datos.

        Siempre incluye `entidades` (los bancos del mercado) para la captura manual.
        Los datos son del cliente autenticado y la respuesta no se guarda en caché.
      security:
        - clienteAuth: []
      parameters:
        - name: mercado
          in: query
          required: false
          schema: { type: string, enum: [CO], default: CO }
      responses:
        '200':
          description: Hipotecas del cliente y bancos del mercado.
          headers:
            Cache-Control:
              schema: { type: string, examples: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditosHipotecarios' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cotizaciones:
    post:
      operationId: crearCotizacion
      tags: [Cotización]
      summary: Cotiza un seguro de vida sobre crédito hipotecario
      description: |
        Calcula la cotización y la deja como **la activa** del cliente: una nueva reemplaza a
        la anterior (el cliente no acumula cotizaciones, compra pólizas). La cotización no
        tiene id propio.

        La identidad sale de la sesión: el cliente no puede cotizar en nombre de otro. La edad
        tampoco viaja en la solicitud: el BFF la calcula de la fecha de nacimiento de la sesión.
        Una sesión emitida antes de ese cambio responde `401`: hay que iniciar sesión de nuevo.

        Cotización y Rating intenta perfilar el riesgo; si esa dependencia no responde, cae a
        tarifa estándar (`personalizado: false`) en vez de fallar. Responde `400` con el campo
        y el rango cuando la edad no está entre 18 y 65 años, o cuando el crédito terminaría
        después de los 75 años.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CotizacionRequest' }
      responses:
        '201':
          description: Cotización creada. Es ahora la activa del cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cotizaciones/actual:
    get:
      operationId: obtenerCotizacionActiva
      tags: [Cotización]
      summary: Consulta la cotización activa del cliente
      description: |
        La cotización activa del cliente de la sesión, para mostrarla en el Home y retomarla.
        `estado` es `EXPIRADA` pasados 30 días de su creación.
      responses:
        '200':
          description: Cotización activa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:

  securitySchemes:
    clienteAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso obtenido en `/v1/sesiones`.

  responses:
    SolicitudInvalida:
      description: Solicitud mal formada o con validación de esquema fallida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
          examples:
            camposInvalidos:
              summary: Campos que no cumplen el esquema
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: La solicitud no cumple el esquema
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones
                errores:
                  - campo: body.email
                    mensaje: String should match pattern '^[^@\s]+@[^@\s]+\.[^@\s]+$'
            campoFaltante:
              summary: Falta un campo obligatorio
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: La solicitud no cumple el esquema
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones/refresco
                errores:
                  - campo: body.refreshToken
                    mensaje: Field required
    NoAutorizado:
      description: Credenciales inválidas, o token de refresco expirado o inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            credencialesInvalidas:
              summary: Correo o contraseña incorrectos
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: credenciales inválidas
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones
            tokenExpirado:
              summary: El token de refresco ya venció
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: token expirado
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones/refresco
    NoEncontrado:
      description: La identidad autenticó bien pero no tiene un cliente registrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            clienteInexistente:
              summary: Sin cliente asociado
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: Cliente no encontrado
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones
    DependenciaNoDisponible:
      description: Una dependencia aguas abajo (Identity Platform / CoreTransaccional) no respondió a tiempo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            dependenciaLenta:
              summary: CoreTransaccional no respondió a tiempo
              value:
                type: about:blank
                title: Dependencia no disponible
                status: 503
                detail: timeout esperando respuesta de svc-core
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones

  schemas:

    CredencialesRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      examples:
        - email: ana.rios@example.com
          password: Clave-Segura-2026
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefrescoRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      examples:
        - refreshToken: eyJhbGciOiJIUzI1NiJ9.eyJ0eXAiOiJyZWZyZXNoIn0.c2lnbmF0dXJh
      properties:
        refreshToken: { type: string }

    Sesion:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, refreshToken]
      examples:
        - accessToken: eyJhbGciOiJIUzI1NiJ9.eyJ0eXAiOiJhY2Nlc3MifQ.c2lnbmF0dXJh
          tokenType: Bearer
          expiresIn: 3600
          refreshToken: eyJhbGciOiJIUzI1NiJ9.eyJ0eXAiOiJyZWZyZXNoIn0.c2lnbmF0dXJh
      properties:
        accessToken: { type: string, description: JWT de sesión emitido por el BFF móvil. }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos de vigencia del accessToken. }
        refreshToken: { type: string }

    DatosCredito:
      type: object
      additionalProperties: false
      required: [valorCredito, plazoRestanteMeses, entidadAcreedora, saldoInsoluto]
      properties:
        valorCredito: { type: number, minimum: 10000000 }
        plazoRestanteMeses:
          type: integer
          minimum: 1
          maximum: 480
          description: Meses que le faltan al crédito. Con la edad, no puede pasar de los 75 años.
        entidadAcreedora: { type: string, minLength: 2, maxLength: 80 }
        saldoInsoluto: { type: number, exclusiveMinimum: 0 }

    CotizacionRequest:
      type: object
      additionalProperties: false
      required: [datosCredito]
      examples:
        - datosCredito:
            valorCredito: 250000000
            plazoRestanteMeses: 180
            entidadAcreedora: Bancolombia
            saldoInsoluto: 238500000
      properties:
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }

    FactorRiesgo:
      type: object
      additionalProperties: false
      required: [descripcion, efecto]
      properties:
        descripcion: { type: string }
        efecto: { type: string, enum: [POSITIVO, NEGATIVO] }
        pesoRelativo: { type: [number, 'null'] }

    PerfilRiesgo:
      type: object
      additionalProperties: false
      required: [nivelRiesgo, factores]
      properties:
        nivelRiesgo: { type: string, enum: [BAJO, MEDIO, ALTO] }
        factores:
          type: array
          items: { $ref: '#/components/schemas/FactorRiesgo' }

    Oferta:
      type: object
      additionalProperties: false
      required: [primaMensual, primaBaseMensual, sumaAsegurada, coberturaMeses, moneda, personalizado]
      properties:
        primaMensual: { type: number }
        primaBaseMensual: { type: number }
        sumaAsegurada: { type: number }
        coberturaMeses: { type: integer }
        moneda: { type: string, const: COP }
        personalizado: { type: boolean }
        fuentesNoDisponibles:
          type: array
          items: { type: string }

    Vigencia:
      type: object
      additionalProperties: false
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }

    Cotizacion:
      type: object
      additionalProperties: false
      required: [estado, producto, datosCredito, origenDatos, oferta, vigenciaCotizacion, creadaEn]
      examples:
        - estado: VIGENTE
          producto: VIDA_HIPOTECARIO
          datosCredito:
            valorCredito: 250000000
            plazoRestanteMeses: 180
            entidadAcreedora: Bancolombia
            saldoInsoluto: 238500000
          origenDatos: DECLARADO
          oferta:
            primaMensual: 96500
            primaBaseMensual: 112000
            sumaAsegurada: 238500000
            coberturaMeses: 180
            moneda: COP
            personalizado: true
          perfilRiesgo:
            nivelRiesgo: BAJO
            factores:
              - descripcion: Historial de pagos al día en los últimos 24 meses
                efecto: POSITIVO
                pesoRelativo: 0.4
              - descripcion: Actividad física regular
                efecto: POSITIVO
                pesoRelativo: 0.2
          vigenciaCotizacion:
            desde: '2026-10-06T14:35:00Z'
            hasta: '2026-11-05T14:35:00Z'
          creadaEn: '2026-10-06T14:35:00Z'
      properties:
        estado: { type: string, enum: [VIGENTE, EXPIRADA] }
        producto: { type: string, const: VIDA_HIPOTECARIO }
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }
        origenDatos:
          type: string
          enum: [DECLARADO]
          description: De dónde salen los datos del crédito. Hoy los escribe el cliente.
        oferta: { $ref: '#/components/schemas/Oferta' }
        perfilRiesgo:
          oneOf:
            - { $ref: '#/components/schemas/PerfilRiesgo' }
            - type: 'null'
        vigenciaCotizacion: { $ref: '#/components/schemas/Vigencia' }
        creadaEn: { type: string, format: date-time }


    EntidadFinanciera:
      type: object
      additionalProperties: false
      required: [id, nombre]
      properties:
        id: { type: string, examples: [bancolombia] }
        nombre: { type: string, examples: [Bancolombia] }

    CreditoHipotecario:
      type: object
      additionalProperties: false
      required: [entidadNombre, valorCredito, saldoInsoluto, plazoRestanteMeses, cuotaMensual]
      properties:
        entidadId:
          type: string
          description: Entidad del mercado a la que corresponde. Ausente si el banco no está en la lista.
        entidadNombre:
          type: string
          description: Nombre de la entidad para mostrar.
        valorCredito: { type: number, description: Monto total del crédito, en COP. }
        saldoInsoluto: { type: number, description: Saldo a hoy, en COP. }
        plazoRestanteMeses: { type: integer, minimum: 1, description: Meses que faltan. }
        cuotaMensual: { type: number, description: Cuota mensual, en COP. }

    CreditosHipotecarios:
      type: object
      additionalProperties: false
      required: [estado, creditos, entidades, origen]
      properties:
        estado:
          type: string
          enum: [DISPONIBLE, SIN_HIPOTECAS, SIN_CONSENTIMIENTO, NO_DISPONIBLE]
        creditos:
          type: array
          items: { $ref: '#/components/schemas/CreditoHipotecario' }
        entidades:
          type: array
          items: { $ref: '#/components/schemas/EntidadFinanciera' }
          description: Bancos del mercado, en el orden en que se presentan.
        origen:
          type: string
          enum: [OPEN_FINANCE]
        fechaConsulta:
          type: string
          format: date-time
          description: Cuándo se trajeron los datos de la fuente. Ausente si no hay datos.

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
      examples:
        - type: about:blank
          title: No autorizado
          status: 401
          detail: credenciales inválidas
          instance: https://dev.solventa4bits.com/mobile/v1/sesiones

    ProblemaValidacion:
      description: |
        `Problema` con el detalle campo por campo. Solo lo devuelve la validación
        del esquema de la solicitud (`400`); el resto de errores no lleva `errores`.
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            errores:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string, description: Ruta del campo con error, por ejemplo `body.email`. }
                  mensaje: { type: string }
      examples:
        - type: about:blank
          title: Solicitud inválida
          status: 400
          detail: La solicitud no cumple el esquema
          instance: https://dev.solventa4bits.com/mobile/v1/sesiones
          errores:
            - campo: body.email
              mensaje: String should match pattern '^[^@\s]+@[^@\s]+\.[^@\s]+$'
