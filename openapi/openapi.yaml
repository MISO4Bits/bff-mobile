openapi: 3.1.3

info:
  title: BFF Móvil — Sesión
  summary: API del canal móvil para iniciar y refrescar la sesión de los clientes de Solventa.
  description: |
    Backend for Frontend del cliente móvil.

    Alcance de esta versión (`0.1.x`): **sesión** — inicio de sesión con correo y
    contraseña y refresco del token de acceso — y el **paso previo a cotizar**: las
    hipotecas del cliente y los bancos del mercado. Mismos endpoints y mismo contrato
    que el canal web; el resto del journey se agrega en versiones posteriores. Incluye la
    **cotización activa** del cliente (`POST` y `GET /v1/cotizaciones`): una por cliente, y una
    nueva reemplaza a la anterior.

    Entrada real: `App móvil → Cloud LB → Cloud Armor (WAF) → API Gateway → BFF Móvil`.

    **Sesión propia.** El BFF móvil emite su propio JWT de sesión, firmado con un
    secreto distinto al del BFF web: un token emitido por un canal no vale en el otro.

    Errores en formato **RFC 9457 (Problem Details)**, `application/problem+json`.
  version: 0.1.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico 4Bits

servers:
  - url: https://dev.solventa4bits.com/mobile
    description: Entorno de desarrollo

tags:
  - name: Sesión
    description: Inicio de sesión y refresco de token.
  - name: Cotización
    description: Paso previo a cotizar el seguro de vida sobre crédito hipotecario.
  - name: Evidencias de identidad
    description: Cédula por ambas caras y selfie previas a la firma. Una foto por request; el servidor decide si sirve.
  - name: Pólizas
    description: Solicitud, consulta y documento de mis pólizas (BITS-101).
  - name: Avisos
    description: Registro del teléfono para recibir avisos push (BITS-229).
  - name: Siniestros
    description: Reporte de siniestros del cliente con evidencia tomada con la cámara (BITS-381).
  - name: Documentos legales
    description: Textos legales vigentes (registro y condiciones de la póliza). Públicos.
security: []

paths:
  /v1/sesiones:
    post:
      operationId: iniciarSesion
      tags: [Sesión]
      summary: Inicia sesión con correo y contraseña
      description: |
        **Público** (no requiere token).

        1. Valida las credenciales en Identity Platform.
        2. Busca al cliente en CoreTransaccional por su identidad.
        3. Emite la sesión (token de acceso y de refresco).

        Responde `401` si las credenciales no son válidas y `404` si la identidad
        existe pero no tiene un cliente registrado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredencialesRequest' }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/sesiones/refresco:
    post:
      operationId: refrescarSesion
      tags: [Sesión]
      summary: Refresca el token de acceso
      description: |
        **Público** (no requiere token de acceso; se autentica con el `refreshToken`).
        Valida el token de refresco y emite una sesión nueva, sin consultar a ningún
        otro servicio. Responde `401` si el token está expirado, es inválido o no es
        un token de refresco.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefrescoRequest' }
      responses:
        '200':
          description: Sesión nueva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sesion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }

  /v1/creditos-hipotecarios:
    get:
      operationId: obtenerCreditosHipotecarios
      tags: [Cotización]
      summary: Hipotecas del cliente y bancos del mercado, para empezar una cotización
      description: |
        Paso previo a cotizar. Devuelve las hipotecas abiertas del cliente que
        Perfilamiento ya trajo de Open Finance cuando el cliente dio su consentimiento
        (no se consulta a la fuente en esta llamada), junto con la lista de bancos del
        mercado. El cliente elige un banco y rellena el formulario con los datos de esa
        hipoteca sin volver a llamar al backend; si no hay datos, escribe los suyos.

        `estado` dice qué mostrar:
        - `DISPONIBLE`: hay hipotecas en `creditos`; el cliente elige una.
        - `SIN_HIPOTECAS`: la fuente respondió y no hay ninguna abierta; captura manual.
        - `SIN_CONSENTIMIENTO`: el cliente no autorizó Open Finance; captura manual.
        - `NO_DISPONIBLE`: no hay datos vigentes y la fuente no respondió; el cliente
          puede reintentar o escribir los datos.

        Siempre incluye `entidades` (los bancos del mercado) para la captura manual.
        Los datos son del cliente autenticado y la respuesta no se guarda en caché.
      security:
        - clienteAuth: []
      parameters:
        - name: mercado
          in: query
          required: false
          schema: { type: string, enum: [CO], default: CO }
      responses:
        '200':
          description: Hipotecas del cliente y bancos del mercado.
          headers:
            Cache-Control:
              schema: { type: string, examples: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditosHipotecarios' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cuenta/evidencias-identidad:
    post:
      operationId: subirMiEvidenciaIdentidad
      tags: [Evidencias de identidad]
      summary: Sube una foto de mi cédula (o la selfie) y recibe el veredicto
      description: |
        Una imagen por request, ya comprimida por el cliente: `tipo` dice qué se sube y
        `imagen` es el archivo (JPEG o PNG, máximo 3 MB). El `clienteId` sale del token.

        El servidor decide si la foto sirve; el cliente solo muestra el resultado:

        - **`ACEPTADA`** (201): la foto queda como evidencia vigente del tipo.
        - **`REINTENTAR`** (200): no se guardó nada. `motivo` dice qué corregir y
          `intentosRestantes` cuántos rechazos quedan antes de pasar a revisión manual.
        - **`REVISION_MANUAL`** (201): se guardó y una persona la revisa; el flujo puede seguir.
          Ocurre si no se pudo leer el código del reverso o su número no coincide con el del
          registro, si el documento no es cédula de ciudadanía, si el análisis tardó demasiado,
          y al tercer rechazo de un mismo tipo.

        El resultado nunca incluye el número leído de la imagen.

        **Selfie (`tipo = selfie`).** Se compara con el frente de la cédula ya guardado, así que
        primero deben estar vigentes **ambas caras** de la cédula; si no, responde `422` y no
        cuenta como intento. El servidor revisa que haya un solo rostro, que sea una persona real
        (prueba de vida pasiva) y que coincida con el de la cédula. Si no está seguro, la deja en
        `REVISION_MANUAL`. Los puntajes no salen en la respuesta.

        Cada envío cuenta como un intento: no se reintenta automáticamente ante un fallo de red.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SubirEvidenciaRequest' }
      responses:
        '200':
          description: La foto no sirve (`estado = REINTENTAR`). No se creó ninguna evidencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '201':
          description: Evidencia guardada (`ACEPTADA` o `REVISION_MANUAL`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenciaSubida' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '413':
          description: La imagen supera el máximo permitido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '422':
          description: Se subió la selfie sin que ambas caras de la cédula estén vigentes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
    get:
      operationId: obtenerMiEstadoDeEvidenciasIdentidad
      tags: [Evidencias de identidad]
      summary: Estado de mis fotos de identidad
      description: |
        Siempre devuelve los tres tipos. `PENDIENTE` es que no hay evidencia vigente. Sirve para
        retomar el flujo donde quedó y para habilitar el paso a la firma: ambas caras de la
        cédula en `ACEPTADA` o `REVISION_MANUAL`.
      responses:
        '200':
          description: Estado por tipo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstadoEvidencia' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cotizaciones:
    post:
      operationId: crearCotizacion
      tags: [Cotización]
      summary: Cotiza un seguro de vida sobre crédito hipotecario
      description: |
        Calcula la cotización y la deja como **la activa** del cliente: una nueva reemplaza a
        la anterior (el cliente no acumula cotizaciones, compra pólizas). La cotización no
        tiene id propio.

        La identidad sale de la sesión: el cliente no puede cotizar en nombre de otro. La edad
        tampoco viaja en la solicitud: el BFF la calcula de la fecha de nacimiento de la sesión.
        Una sesión emitida antes de ese cambio responde `401`: hay que iniciar sesión de nuevo.

        Cotización y Rating intenta perfilar el riesgo; si esa dependencia no responde, cae a
        tarifa estándar (`personalizado: false`) en vez de fallar. Responde `400` con el campo
        y el rango cuando la edad no está entre 18 y 65 años, o cuando el crédito terminaría
        después de los 75 años.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CotizacionRequest' }
      responses:
        '201':
          description: Cotización creada. Es ahora la activa del cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cotizaciones/actual:
    get:
      operationId: obtenerCotizacionActiva
      tags: [Cotización]
      summary: Consulta la cotización activa del cliente
      description: |
        La cotización activa del cliente de la sesión, para mostrarla en el Home y retomarla.
        `estado` es `EXPIRADA` pasados 30 días de su creación.
      responses:
        '200':
          description: Cotización activa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cotizacion' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      operationId: eliminarCotizacionActiva
      tags: [Cotización]
      summary: Elimina la cotización activa del cliente (declinar las condiciones)
      description: |
        El cliente declinó las condiciones: se borra su cotización activa y vuelve al estado
        de cero cotizaciones (`GET /v1/cotizaciones/actual` responde `404`). No se conserva
        historial. Si el cliente no tiene cotización activa responde `404`.

        La identidad sale de la sesión: el cliente solo puede eliminar su propia cotización.
      responses:
        '204':
          description: Cotización eliminada.
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }

  /v1/cuenta/polizas:
    post:
      operationId: solicitarMiPoliza
      tags:
      - Pólizas
      summary: Solicita la póliza de mi cotización activa
      description: "El cliente envía **qué coberturas quiere**, **qué cotización vio** y **qué documentos\n\
        aceptó**. Prima, crédito y edad no se envían: salen de la cotización activa guardada.\n\nLa solicitud\
        \ se identifica por (cliente, `cotizacionCreadaEn`):\n\n- Si no existía, se crea (**201**). Queda\
        \ `EMITIDA` si no falta nada, o `PENDIENTE` con la\n  lista de `pendientes`. La interfaz decide\
        \ por `estado`, no por el código.\n- Si ya existía con las mismas coberturas, no se modifica nada:\
        \ si está `PENDIENTE` se\n  re-evalúa y se devuelve el estado actual (**200**); si está `EMITIDA`,\
        \ se devuelve tal\n  cual (**200**).\n- Si ya existía con coberturas distintas, **409** `SOLICITUD_EXISTENTE`.\
        \ Para cambiar de\n  coberturas el cliente vuelve a cotizar.\n- Si ya existía y fue `RECHAZADA`,\
        \ **409** `SOLICITUD_RECHAZADA`. Para intentarlo de nuevo\n  el cliente vuelve a cotizar.\n- Si\
        \ el cliente tenía otra solicitud `PENDIENTE` de otra cotización, esa se borra.\n\nLa póliza solo\
        \ consume las evidencias de identidad cuando se emite.\n\nErrores duros (no se crea nada): `400`\
        \ coberturas inválidas (cobertura desconocida o sin\n`VIDA`) o documentos sin aceptar; `403` cliente\
        \ no activo; `409` sin cotización, cotización\nvencida o distinta de la que vio el cliente; `422`\
        \ edad o plazo fuera de rango;\n`503` Cotización no disponible (reintentar).\n\nNo se reintenta\
        \ automáticamente ante un fallo de red.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarPolizaRequest'
            examples:
              soloVida:
                summary: Solo la cobertura obligatoria
                value:
                  coberturas:
                  - VIDA
                  cotizacionCreadaEn: '2026-10-24T15:04:05Z'
                  documentosAceptados:
                  - tipo: poliza
                    version: V1
              vidaYHogar:
                summary: Con Hogar
                value:
                  coberturas:
                  - VIDA
                  - HOGAR
                  cotizacionCreadaEn: '2026-10-24T15:04:05Z'
                  documentosAceptados:
                  - tipo: poliza
                    version: V1
      responses:
        '200':
          description: Ya existía una solicitud de esa cotización; se devuelve su estado actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '201':
          description: Solicitud creada (`EMITIDA` o `PENDIENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
              examples:
                pendiente:
                  summary: Quedó pendiente
                  value:
                    polizaId: 7c0f2a52-3b6f-4a0e-9e7e-2f6c9d1a8b11
                    numero: null
                    estado: PENDIENTE
                    producto: VIDA_HIPOTECARIO
                    creadaEn: '2026-10-24T15:10:00Z'
                    emitidaEn: null
                    solicitudVigenteHasta: '2026-11-23T15:04:05Z'
                    vigencia: null
                    coberturas:
                    - codigo: VIDA
                      obligatoria: true
                      sumaAsegurada: 180000000
                      primaNeta: 62000
                      iva: 11780
                      primaTotal: 73780
                    primaTotalMensual: 73780
                    moneda: COP
                    datosCredito:
                      valorCredito: 220000000
                      plazoRestanteMeses: 180
                      entidadAcreedora: Bancolombia
                      saldoInsoluto: 180000000
                    origenDatos: DECLARADO
                    cotizacionCreadaEn: '2026-10-24T15:04:05Z'
                    pendientes:
                    - codigo: EVIDENCIA_FALTANTE
                      tipo: USUARIO
                      mensaje: Sube la selfie para continuar.
                      detalle:
                        evidencias:
                        - selfie
                    - codigo: CREDITO_NO_VERIFICADO
                      tipo: AGENTE
                      mensaje: Los datos de tu crédito deben ser verificados por un agente.
                    documento:
                      estado: NO_DISPONIBLE
                    rechazo: null
                    documentosAceptados:
                    - tipo: poliza
                      version: V1
                      aceptadoEn: '2026-10-24T15:10:00Z'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/ConflictoPoliza'
        '422':
          $ref: '#/components/responses/FueraDeRango'
        '503':
          $ref: '#/components/responses/NoDisponible'
      security:
      - clienteAuth: []
    get:
      operationId: listarMisPolizas
      tags:
      - Pólizas
      summary: Lista mis pólizas
      description: 'Las pólizas del cliente, de la más reciente a la más antigua. Alimenta el Home. Sin

        paginar: un cliente tiene pocas. `estado` filtra; `VENCIDA` es el derivado.

        '
      parameters:
      - $ref: '#/components/parameters/EstadoPolizaFiltro'
      responses:
        '200':
          description: Pólizas del cliente.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Poliza'
        '401':
          $ref: '#/components/responses/NoAutenticado'
      security:
      - clienteAuth: []
  /v1/cuenta/polizas/{polizaId}:
    parameters:
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerMiPoliza
      tags:
      - Pólizas
      summary: Consulta una póliza mía
      description: 'Si está `PENDIENTE`, **se re-evalúa antes de responder** (comprobaciones locales): si
        el

        cliente ya cumplió lo último que faltaba, la respuesta ya llega `EMITIDA`. La interfaz puede

        sondear este endpoint mientras muestra los pendientes.

        '
      responses:
        '200':
          description: La póliza con su estado y pendientes actuales.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poliza'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
      security:
      - clienteAuth: []
  /v1/cuenta/polizas/{polizaId}/documento:
    parameters:
    - $ref: '#/components/parameters/PolizaId'
    get:
      operationId: obtenerDocumentoMiPoliza
      tags:
      - Pólizas
      summary: Descarga el documento de mi póliza
      description: 'Solo existe para pólizas `EMITIDA`. El documento lo genera de forma asíncrona la función
        de

        Comunicaciones y Documentos al recibir el evento de emisión; si todavía no está, se genera

        bajo demanda.

        '
      responses:
        '200':
          description: Documento listo; el enlace es temporal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoPoliza'
        '202':
          description: Se está generando. Reintentar tras `Retry-After`.
          headers:
            Retry-After:
              schema:
                type: integer
                example: 2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoPoliza'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La póliza no está emitida (`codigo = POLIZA_NO_EMITIDA`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaPoliza'
        '503':
          $ref: '#/components/responses/NoDisponible'
      security:
      - clienteAuth: []

  /v1/cuenta/siniestros:
    post:
      operationId: reportarMiSiniestro
      tags: [Siniestros]
      summary: Reporta un siniestro con su evidencia
      description: |
        Es `multipart/form-data`. La parte `datos` (JSON) lleva la póliza, el tipo, la fecha, la
        narración, el destino del pago y, por cada archivo, su clase y su ubicación. Las partes
        `archivos` son las imágenes, en el **mismo orden** que `datos.archivos`. La ubicación de
        cada foto viaja en `datos` y no en la foto, porque la app borra los metadatos al
        recomprimirla; `latitud` y `longitud` son `null` si no hay permiso de ubicación.

        Cada cobertura tiene su camino:

        - Vida, `INCAPACIDAD_TOTAL`: al menos un `DOCUMENTO` (el dictamen). Sin `destinoPago`: se
          paga al banco.
        - Tu casa, `INCENDIO_TERREMOTO`: `narracion`, `destinoPago` y al menos una `FOTO`. Las
          fotos se toman con la cámara, nunca de la galería.

        **Idempotente con `Idempotency-Key`.** Si se cae la conexión, la app reintenta con la
        misma llave y se crea un solo siniestro.

        El siniestro queda `EN_ESTUDIO` con su `numero`, el radicado que ve el cliente. Solventa
        guarda una sola vez el saldo del crédito, el de Open Finance o, si no responde, el de la
        póliza. La fecha de ocurrencia se compara con la emisión de la póliza y con el fin de su
        vigencia. El `clienteId` sale de la sesión.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datos, archivos]
              properties:
                datos: { $ref: '#/components/schemas/ReportarSiniestroDatos' }
                archivos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: binary }
            encoding:
              datos: { contentType: application/json }
              archivos: { contentType: 'image/jpeg, image/png' }
      responses:
        '201':
          description: Siniestro radicado, `EN_ESTUDIO`.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiniestroReportado' }
        '400':
          description: |
            Reporte inválido (`errores[].campo`) o `TIPO_NO_CUBIERTO`: es `INCENDIO_TERREMOTO` y la
            póliza no tiene la cobertura `HOGAR`. Falta la narración, el destino del pago o la
            evidencia, el destino llega en `INCAPACIDAD_TOTAL`, o una imagen no sirve.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            `FUERA_DE_VIGENCIA`: la fecha es futura, anterior a la emisión o posterior al fin de la
            vigencia, o la póliza no está `EMITIDA` ni `DESACTIVADA`. `SINIESTRO_EN_CURSO`: la
            póliza ya tiene un siniestro de esa cobertura `EN_ESTUDIO` o `FALTA_INFORMACION`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '413':
          description: Una imagen supera el máximo permitido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
      security:
        - clienteAuth: []

    get:
      operationId: listarMisSiniestros
      tags: [Siniestros]
      summary: Lista mis siniestros
      description: |
        Del más reciente al más antiguo, sin paginar. Incluye los de pago automático por sismo
        (`automatico: true`). El detalle de cada uno está en `/v1/cuenta/siniestros/{siniestroId}`.
        El `clienteId` sale de la sesión.
      responses:
        '200':
          description: Mis siniestros (vacía si no tengo).
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SiniestroResumen' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
      security:
        - clienteAuth: []

  /v1/cuenta/siniestros/{siniestroId}:
    parameters:
      - name: siniestroId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: obtenerMiSiniestro
      tags: [Siniestros]
      summary: En qué va mi siniestro
      description: |
        Estado, plazo y lo que necesito saber: lo que Solventa pidió (`evidenciaPedida`), el motivo
        del rechazo, la orden de pago y mis archivos con la fecha de cada entrega. En el paramétrico
        trae también `automatico` y `evento`.

        `fechaLimite` (la última entrega más un mes) solo existe en `EN_ESTUDIO`: en
        `FALTA_INFORMACION` el reloj se detiene. **No devuelve el saldo del crédito ni el destino
        del pago.** Un siniestro de otro cliente responde `404`, igual que uno que no existe.
      responses:
        '200':
          description: El siniestro.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Siniestro' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
      security:
        - clienteAuth: []

  /v1/cuenta/siniestros/{siniestroId}/evidencias:
    parameters:
      - name: siniestroId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: entregarEvidenciasDeMiSiniestro
      tags: [Siniestros]
      summary: Envía lo que Solventa me pidió
      description: |
        Solo con el siniestro en `FALTA_INFORMACION`. Es `multipart/form-data`, igual que el reporte:
        la parte `datos` (JSON) lleva, por cada archivo, su clase y su ubicación, y las partes
        `archivos` son las imágenes, en el **mismo orden**.

        El siniestro vuelve a `EN_ESTUDIO`, el plazo corre de nuevo desde esta entrega y cada archivo
        queda con su fecha (`entregadoEn`). No genera aviso. Responde el detalle actualizado.

        **Idempotente con `Idempotency-Key`.**
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [datos, archivos]
              properties:
                datos: { $ref: '#/components/schemas/EntregarEvidenciasDatos' }
                archivos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: binary }
            encoding:
              datos: { contentType: application/json }
              archivos: { contentType: 'image/jpeg, image/png' }
      responses:
        '201':
          description: Evidencia recibida; el siniestro volvió a `EN_ESTUDIO`.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Siniestro' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            `ESTADO_NO_PERMITE`: el siniestro no está en `FALTA_INFORMACION` (no se pidió nada, o
            otra entrega llegó primero).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '413':
          description: Una imagen supera el máximo permitido.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
      security:
        - clienteAuth: []

  /v1/cuenta/siniestros/{siniestroId}/asistencias:
    parameters:
      - name: siniestroId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: pedirAyudaEnSitio
      tags: [Siniestros]
      summary: Pide ayuda en sitio para mi casa dañada
      description: |
        Solo en un siniestro de incendio o terremoto (`INCENDIO_TERREMOTO`) que esté `EN_ESTUDIO` o
        `FALTA_INFORMACION`. La app manda el prestador que el cliente eligió en
        `GET /v1/catalogos/siniestros` y el punto al que va: `FOTOS` o `TELEFONO` (con `latitud` y
        `longitud`) o `DIRECCION` (con `direccion` y `localidad`). No se compara el GPS con ninguna
        dirección.

        No cambia el estado del siniestro ni su plazo. Con la misma `Idempotency-Key`, repetir la
        solicitud devuelve la misma. La solicitud aparece en `asistencias` del detalle del
        siniestro.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedirAyudaRequest' }
      responses:
        '201':
          description: Ayuda solicitada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asistencia' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: |
            `AYUDA_NO_DISPONIBLE`: el siniestro no es de incendio o terremoto. `ESTADO_NO_PERMITE`:
            ya está `PAGADO` o `RECHAZADO`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemaSiniestro' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
      security:
        - clienteAuth: []

  /v1/catalogos/siniestros:
    get:
      operationId: obtenerCatalogoDeSiniestros
      tags: [Siniestros]
      summary: Tipos de ayuda, localidades, prestadores y oficinas
      description: |
        Todo lo que la app necesita para pedir ayuda en sitio y mostrar las oficinas del banco, en
        una sola respuesta: la app filtra por tipo y ordena por distancia en el teléfono. Es
        configuración del mercado que casi no cambia: se puede guardar una hora en el dispositivo.
      parameters:
        - name: mercado
          in: query
          required: false
          schema: { type: string, enum: [CO], default: CO }
      responses:
        '200':
          description: El catálogo del mercado.
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, max-age=3600' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoSiniestros' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
      security:
        - clienteAuth: []

  /v1/cuenta/dispositivos:
    put:
      operationId: registrarMiDispositivo
      tags: [Avisos]
      summary: Registra mi teléfono para recibir avisos push
      description: |
        La app lo llama cuando hay sesión y el permiso de notificaciones está concedido: al
        arrancar, al iniciar sesión y cada vez que Firebase le entrega un token nuevo. El cliente
        final no hace ningún paso: aceptar el permiso basta.

        **Idempotente.** Repetir el mismo `token` devuelve el mismo `dispositivoId`. Si el token
        ya estaba registrado con otro cliente (teléfono compartido), pasa a este. Cada cliente
        conserva como máximo 5 dispositivos; al registrar uno más se descarta el que lleva más
        tiempo sin verse.

        La app guarda el `dispositivoId` para darlo de baja al cerrar sesión. El `clienteId` sale
        de la sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarDispositivoRequest' }
      responses:
        '200':
          description: Dispositivo registrado.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispositivo' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
      security:
        - clienteAuth: []

  /v1/cuenta/dispositivos/{dispositivoId}:
    parameters:
      - name: dispositivoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: quitarMiDispositivo
      tags: [Avisos]
      summary: Da de baja mi teléfono de los avisos push
      description: |
        La app lo llama antes de cerrar sesión, sin bloquear el cierre: si no hay red, el cierre
        sigue igual. **Idempotente:** si el dispositivo ya no existe responde igual `204`.
      responses:
        '204':
          description: El teléfono ya no recibe avisos de este cliente.
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/DependenciaNoDisponible' }
      security:
        - clienteAuth: []

  /v1/documentos-legales:
    get:
      operationId: listarDocumentosLegales
      tags:
      - Documentos legales
      summary: Documentos legales vigentes, con su contenido
      description: '**Público** (no requiere token): el registro los muestra antes de que exista

        una sesión.


        Devuelve la versión vigente de cada documento (`terminos`, `open-data`,

        `open-finance`) ya con el contenido completo, en el orden en que el registro

        los presenta. Una sola llamada deja listos los tres modales sin más viajes a

        la red. Proxya a Productos y Configuración de Mercado sin transformar nada.


        Sin `tipo` devuelve solo los tres del registro. Con `tipo=poliza` devuelve las

        condiciones de la póliza, que la interfaz muestra al solicitarla y cuya `version`

        envía en `documentosAceptados` de `POST /v1/cuenta/polizas`.


        **Aceptación.** El BFF no registra qué aceptó el cliente. La web devuelve la

        `version` de cada documento que mostró en los campos `politicaVersion*` de

        `POST /v1/registro`, y CoreTransaccional la guarda como evidencia.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/Mercado'
      - $ref: '#/components/parameters/Idioma'
      - name: tipo
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TipoDocumentoLegal'
      responses:
        '200':
          description: Versión vigente de cada documento del mercado e idioma.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentoLegal'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'
  /v1/documentos-legales/{tipo}/versiones/{version}:
    get:
      operationId: obtenerVersionDocumentoLegal
      tags:
      - Documentos legales
      summary: Una versión exacta de un documento (inmutable)
      description: '**Público** (no requiere token). Devuelve el texto exacto de una versión ya

        publicada: sirve para mostrar lo que el cliente aceptó aunque exista una

        versión posterior.


        Una versión publicada nunca cambia, por eso la respuesta se puede guardar

        indefinidamente (`Cache-Control: immutable`).

        '
      security: []
      parameters:
      - name: tipo
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TipoDocumentoLegal'
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: ^V[1-9][0-9]*$
          examples:
          - V1
      - $ref: '#/components/parameters/Mercado'
      - $ref: '#/components/parameters/Idioma'
      responses:
        '200':
          description: Versión solicitada.
          headers:
            Cache-Control:
              description: Una versión publicada nunca cambia.
              schema:
                type: string
                example: public, max-age=31536000, immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoLegal'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/DependenciaNoDisponible'

components:

  securitySchemes:
    clienteAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso obtenido en `/v1/sesiones`.

  parameters:
    Mercado:
      name: mercado
      in: query
      required: true
      schema:
        type: string
        enum:
        - CO
    Idioma:
      name: idioma
      in: query
      required: false
      schema:
        type: string
        pattern: ^[a-z]{2}-[A-Z]{2}$
        default: es-CO
        examples:
        - es-CO
    PolizaId:
      name: polizaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EstadoPolizaFiltro:
      name: estado
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EstadoPoliza'

  responses:
    ConflictoPoliza:
      description: '`SIN_COTIZACION` (el cliente no tiene cotización activa), `COTIZACION_VENCIDA`,

        `COTIZACION_CAMBIO` (la activa no es la que el cliente vio: volver a mostrarla),

        `SOLICITUD_EXISTENTE` (ya hay una solicitud de esa cotización con otras coberturas) o

        `SOLICITUD_RECHAZADA` (esa solicitud fue rechazada por un agente).

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    NoDisponible:
      description: 'Un servicio del que depende la operación no responde: Cotización al solicitar

        (`codigo = COTIZACION_NO_DISPONIBLE`; no se emite nada) o el de documentos al pedir el

        documento (`codigo = DOCUMENTO_NO_DISPONIBLE`). Reintentar.

        '
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    NoAutenticado:
      description: Falta el token o no es válido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Prohibido:
      description: El cliente no está `ACTIVO` (`codigo = CLIENTE_NO_ACTIVO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    FueraDeRango:
      description: Edad o plazo fuera de rango (`codigo = FUERA_DE_RANGO`). No se crea la solicitud.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemaPoliza'
    SolicitudInvalida:
      description: Solicitud mal formada o con validación de esquema fallida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemaValidacion' }
          examples:
            camposInvalidos:
              summary: Campos que no cumplen el esquema
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: La solicitud no cumple el esquema
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones
                errores:
                  - campo: body.email
                    mensaje: String should match pattern '^[^@\s]+@[^@\s]+\.[^@\s]+$'
            campoFaltante:
              summary: Falta un campo obligatorio
              value:
                type: about:blank
                title: Solicitud inválida
                status: 400
                detail: La solicitud no cumple el esquema
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones/refresco
                errores:
                  - campo: body.refreshToken
                    mensaje: Field required
    NoAutorizado:
      description: Credenciales inválidas, o token de refresco expirado o inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            credencialesInvalidas:
              summary: Correo o contraseña incorrectos
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: credenciales inválidas
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones
            tokenExpirado:
              summary: El token de refresco ya venció
              value:
                type: about:blank
                title: No autorizado
                status: 401
                detail: token expirado
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones/refresco
    NoEncontrado:
      description: La identidad autenticó bien pero no tiene un cliente registrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            clienteInexistente:
              summary: Sin cliente asociado
              value:
                type: about:blank
                title: Recurso no encontrado
                status: 404
                detail: Cliente no encontrado
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones
    DependenciaNoDisponible:
      description: Una dependencia aguas abajo (Identity Platform / CoreTransaccional) no respondió a tiempo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            dependenciaLenta:
              summary: CoreTransaccional no respondió a tiempo
              value:
                type: about:blank
                title: Dependencia no disponible
                status: 503
                detail: timeout esperando respuesta de svc-core
                instance: https://dev.solventa4bits.com/mobile/v1/sesiones

  schemas:
    TipoDocumentoLegal:
      type: string
      enum:
      - terminos
      - open-data
      - open-finance
      - poliza
      description: '- `terminos` — términos y condiciones y aviso de privacidad.

        - `open-data` — tratamiento de datos personales.

        - `open-finance` — consulta en centrales de riesgo (datos financieros).

        - `poliza` — condiciones de la póliza; se muestran al solicitarla, no en el registro.

        '
    DocumentoLegal:
      type: object
      additionalProperties: false
      required:
      - tipo
      - version
      - titulo
      - baseLegal
      - contenido
      examples:
      - tipo: open-finance
        version: V1
        titulo: Consulta en centrales de riesgo
        subtitulo: Es opcional. Si la das, tu precio puede bajar.
        baseLegal: Ley 1266 de 2008
        contenido: <h3>1 · Qué autorizas</h3><p>Consultar y reportar tu comportamiento crediticio ante los
          operadores de información.</p><h3>2 · Puedes retirarla</h3><p>Quitas esta autorización cuando quieras
          desde tu perfil.</p>
        notaPie: Es opcional. Si no la autorizas puedes seguir igual.
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDocumentoLegal'
        version:
          type: string
          pattern: ^V[1-9][0-9]*$
          description: Versión publicada (`V1`, `V2`, …). La web la envía de vuelta al registrar la aceptación.
        titulo:
          type: string
        subtitulo:
          type: string
          description: Se omite cuando no tiene.
        baseLegal:
          type: string
          description: Ley que respalda el documento, por ejemplo `Ley 1581 de 2012`.
        contenido:
          type: string
          description: 'Cuerpo del documento con formato (HTML).

            Etiquetas permitidas: `h3`, `p`, `ul`, `ol`, `li`, `strong`, `em`, `a`, `span`.

            Atributos permitidos: `href` en `a` (solo esquemas `https` y `mailto`) y

            `class` (solo valores con prefijo `legal-`, por ejemplo `legal-highlight`).

            No se permiten `style`, `script`, etiquetas de estilo, imágenes ni

            manejadores de eventos. La web define el significado visual de cada clase

            `legal-*` y debe sanear el HTML con esta misma lista antes de pintarlo.

            '
        notaPie:
          type: string
          description: Texto de pie del documento. Se omite cuando no tiene.
    Poliza:
      type: object
      required:
      - polizaId
      - estado
      - producto
      - creadaEn
      - coberturas
      - primaTotalMensual
      - moneda
      - datosCredito
      - origenDatos
      - cotizacionCreadaEn
      - pendientes
      - documento
      properties:
        polizaId:
          type: string
          format: uuid
        numero:
          type:
          - string
          - 'null'
          example: SOL-VH-2026-K7M2Q9
          description: Solo cuando está `EMITIDA`.
        estado:
          $ref: '#/components/schemas/EstadoPoliza'
        producto:
          type: string
          enum:
          - VIDA_HIPOTECARIO
        creadaEn:
          type: string
          format: date-time
        emitidaEn:
          type:
          - string
          - 'null'
          format: date-time
        solicitudVigenteHasta:
          type:
          - string
          - 'null'
          format: date-time
          description: 'Fin de la vigencia de la cotización atada. Una solicitud `PENDIENTE` pasa a `VENCIDA`

            después de esta fecha. `null` si está `EMITIDA`.

            '
        vigencia:
          oneOf:
          - $ref: '#/components/schemas/Vigencia'
          - type: 'null'
          description: Vigencia de la cobertura; solo cuando está `EMITIDA`.
        coberturas:
          type: array
          items:
            $ref: '#/components/schemas/CoberturaContratada'
        primaTotalMensual:
          type: number
        moneda:
          type: string
          enum:
          - COP
        datosCredito:
          $ref: '#/components/schemas/DatosCredito'
        origenDatos:
          $ref: '#/components/schemas/OrigenDatos'
        cotizacionCreadaEn:
          type: string
          format: date-time
        pendientes:
          type: array
          description: Vacía cuando está `EMITIDA`.
          items:
            $ref: '#/components/schemas/Pendiente'
        documento:
          $ref: '#/components/schemas/EstadoDocumento'
        documentosAceptados:
          type: array
          items:
            $ref: '#/components/schemas/DocumentoAceptado'
        rechazo:
          type:
          - object
          - 'null'
          additionalProperties: false
          required:
          - motivos
          - rechazadaEn
          description: Solo cuando está `RECHAZADA`.
          properties:
            motivos:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - codigo
                - mensaje
                properties:
                  codigo:
                    $ref: '#/components/schemas/CodigoPendienteDeAgente'
                  mensaje:
                    type: string
                    description: Texto fijo del escenario
                    listo para mostrar.: null
            rechazadaEn:
              type: string
              format: date-time
    EstadoPoliza:
      type: string
      enum:
      - PENDIENTE
      - EMITIDA
      - RECHAZADA
      - VENCIDA
      description: '`VENCIDA` se deriva al leer; no se guarda.'
    DocumentoPoliza:
      type: object
      additionalProperties: false
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - GENERANDO
          - LISTO
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Enlace temporal; solo con `LISTO`.
        expiraEn:
          type:
          - string
          - 'null'
          format: date-time
    SolicitarPolizaRequest:
      type: object
      additionalProperties: false
      required:
      - coberturas
      - cotizacionCreadaEn
      - documentosAceptados
      properties:
        coberturas:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CodigoCobertura'
          description: Debe incluir `VIDA` (obligatoria). `HOGAR` es opcional.
        cotizacionCreadaEn:
          type: string
          format: date-time
          description: '`creadaEn` de la cotización que el cliente tiene en pantalla. Si no coincide con la

            activa, responde 409 `COTIZACION_CAMBIO`: el cliente no paga un precio que no vio.

            '
        documentosAceptados:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentoAceptadoEntrada'
          description: 'Documentos legales que la interfaz mostró y el cliente aceptó. Debe incluir el tipo

            `poliza`. Se guardan con fecha de aceptación. No se valida que la versión exista en

            Productos, igual que las versiones de política del registro.

            '
    CodigoCobertura:
      type: string
      enum:
      - VIDA
      - HOGAR
    CodigoPendienteDeAgente:
      type: string
      enum:
      - EVIDENCIA_EN_REVISION
      - CREDITO_NO_VERIFICADO
    Pendiente:
      type: object
      additionalProperties: false
      required:
      - codigo
      - tipo
      - mensaje
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoPendiente'
        tipo:
          $ref: '#/components/schemas/TipoPendiente'
        mensaje:
          type: string
          description: Texto listo para mostrar al cliente.
        detalle:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            evidencias:
              type: array
              items:
                $ref: '#/components/schemas/TipoEvidencia'
              description: En `EVIDENCIA_FALTANTE` y `EVIDENCIA_EN_REVISION`, cuáles.
    EstadoDocumento:
      type: object
      additionalProperties: false
      required:
      - estado
      properties:
        estado:
          type: string
          enum:
          - NO_DISPONIBLE
          - DISPONIBLE
          description: '`DISPONIBLE`: la póliza está emitida y ya se puede pedir el documento (si todavía
            se

            está generando, `GET .../documento` responde 202). `NO_DISPONIBLE`: aún no está emitida.

            '
    DocumentoAceptado:
      type: object
      additionalProperties: false
      required:
      - tipo
      - version
      - aceptadoEn
      properties:
        tipo:
          type: string
          enum:
          - poliza
        version:
          type: string
        aceptadoEn:
          type: string
          format: date-time
    ProblemaPoliza:
      allOf:
      - $ref: '#/components/schemas/Problema'
      - type: object
        properties:
          codigo:
            type: string
            enum:
            - CLIENTE_NO_ACTIVO
            - SIN_COTIZACION
            - COTIZACION_VENCIDA
            - COTIZACION_CAMBIO
            - COTIZACION_NO_DISPONIBLE
            - FUERA_DE_RANGO
            - SOLICITUD_EXISTENTE
            - SOLICITUD_RECHAZADA
            - POLIZA_NO_EMITIDA
            - POLIZA_NO_PENDIENTE
            - SOLICITUD_VENCIDA
            - PENDIENTE_NO_APLICA
            - DOCUMENTO_NO_DISPONIBLE
    CoberturaContratada:
      type: object
      additionalProperties: false
      required:
      - codigo
      - obligatoria
      - sumaAsegurada
      - primaNeta
      - iva
      - primaTotal
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCobertura'
        obligatoria:
          type: boolean
        sumaAsegurada:
          type: number
        primaNeta:
          type: number
        iva:
          type: number
        primaTotal:
          type: number
    OrigenDatos:
      type: string
      enum:
      - CONFIRMADO
      - DECLARADO
      description: '`CONFIRMADO` si el crédito coincide exactamente con una hipoteca reportada por Open Finance;

        `DECLARADO` en cualquier otro caso.

        '
    CodigoPendiente:
      type: string
      enum:
      - CORREO_SIN_CONFIRMAR
      - EVIDENCIA_FALTANTE
      - EVIDENCIA_EN_REVISION
      - CREDITO_NO_VERIFICADO
    DocumentoAceptadoEntrada:
      type: object
      additionalProperties: false
      required:
      - tipo
      - version
      properties:
        tipo:
          type: string
          enum:
          - poliza
        version:
          type: string
          pattern: ^V[0-9]+$
          description: Versión del documento legal mostrada (inmutable en Productos), por ejemplo `V1`.
    TipoPendiente:
      type: string
      enum:
      - USUARIO
      - AGENTE

    CredencialesRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      examples:
        - email: ana.rios@example.com
          password: Clave-Segura-2026
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RefrescoRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      examples:
        - refreshToken: eyJhbGciOiJIUzI1NiJ9.eyJ0eXAiOiJyZWZyZXNoIn0.c2lnbmF0dXJh
      properties:
        refreshToken: { type: string }

    Sesion:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, refreshToken]
      examples:
        - accessToken: eyJhbGciOiJIUzI1NiJ9.eyJ0eXAiOiJhY2Nlc3MifQ.c2lnbmF0dXJh
          tokenType: Bearer
          expiresIn: 3600
          refreshToken: eyJhbGciOiJIUzI1NiJ9.eyJ0eXAiOiJyZWZyZXNoIn0.c2lnbmF0dXJh
      properties:
        accessToken: { type: string, description: JWT de sesión emitido por el BFF móvil. }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos de vigencia del accessToken. }
        refreshToken: { type: string }

    DatosCredito:
      type: object
      additionalProperties: false
      required: [valorCredito, plazoRestanteMeses, entidadAcreedora, saldoInsoluto]
      properties:
        valorCredito: { type: number, minimum: 10000000 }
        plazoRestanteMeses:
          type: integer
          minimum: 1
          maximum: 480
          description: Meses que le faltan al crédito. Con la edad, no puede pasar de los 75 años.
        entidadAcreedora: { type: string, minLength: 2, maxLength: 80 }
        saldoInsoluto: { type: number, exclusiveMinimum: 0 }

    CotizacionRequest:
      type: object
      additionalProperties: false
      required: [datosCredito]
      examples:
        - datosCredito:
            valorCredito: 250000000
            plazoRestanteMeses: 180
            entidadAcreedora: Bancolombia
            saldoInsoluto: 238500000
      properties:
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }

    FactorRiesgo:
      type: object
      additionalProperties: false
      required: [descripcion, efecto]
      properties:
        descripcion: { type: string }
        efecto: { type: string, enum: [POSITIVO, NEGATIVO] }
        pesoRelativo: { type: [number, 'null'] }

    PerfilRiesgo:
      type: object
      additionalProperties: false
      required: [nivelRiesgo, factores]
      properties:
        nivelRiesgo: { type: string, enum: [BAJO, MEDIO, ALTO] }
        factores:
          type: array
          items: { $ref: '#/components/schemas/FactorRiesgo' }

    Oferta:
      type: object
      additionalProperties: false
      required: [primaMensual, primaBaseMensual, sumaAsegurada, coberturaMeses, moneda, personalizado, desglose]
      properties:
        primaMensual: { type: number }
        primaBaseMensual: { type: number }
        sumaAsegurada: { type: number }
        coberturaMeses: { type: integer }
        moneda: { type: string, const: COP }
        personalizado: { type: boolean }
        fuentesNoDisponibles:
          type: array
          items: { type: string }
        desglose: { $ref: '#/components/schemas/Desglose' }

    CoberturaPrecio:
      type: object
      additionalProperties: false
      required: [codigo, obligatoria, sumaAsegurada, primaNeta, iva, primaTotal]
      properties:
        codigo: { type: string, enum: [VIDA, HOGAR] }
        obligatoria: { type: boolean, description: true para VIDA, false para HOGAR. }
        sumaAsegurada:
          type: number
          description: "VIDA: saldo insoluto. HOGAR: min(240.000.000, valorCredito)."
        primaNeta: { type: number, description: Prima mensual sin IVA. }
        iva: { type: number, description: IVA mensual. 0 en VIDA; 19 % de primaNeta en HOGAR. }
        primaTotal: { type: number, description: Prima mensual con IVA (primaNeta + iva). }

    Desglose:
      type: object
      additionalProperties: false
      required: [coberturas]
      description: |
        Precio de cada cobertura. No trae totales: el servicio no guarda la selección del
        cliente, así que el front suma los `primaNeta`, `iva` y `primaTotal` de las coberturas
        que el cliente elija. HOGAR es opcional y no viene marcada por defecto.
      properties:
        coberturas:
          type: array
          items: { $ref: '#/components/schemas/CoberturaPrecio' }

    Vigencia:
      type: object
      additionalProperties: false
      required: [desde, hasta]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }

    Cotizacion:
      type: object
      additionalProperties: false
      required: [estado, producto, datosCredito, origenDatos, oferta, vigenciaCotizacion, creadaEn]
      examples:
        - estado: VIGENTE
          producto: VIDA_HIPOTECARIO
          datosCredito:
            valorCredito: 250000000
            plazoRestanteMeses: 180
            entidadAcreedora: Bancolombia
            saldoInsoluto: 238500000
          origenDatos: DECLARADO
          oferta:
            primaMensual: 39734
            primaBaseMensual: 46746
            sumaAsegurada: 238500000
            coberturaMeses: 180
            moneda: COP
            personalizado: true
            desglose:
              coberturas:
                - codigo: VIDA
                  obligatoria: true
                  sumaAsegurada: 238500000
                  primaNeta: 39734
                  iva: 0
                  primaTotal: 39734
                - codigo: HOGAR
                  obligatoria: false
                  sumaAsegurada: 240000000
                  primaNeta: 23760
                  iva: 4514
                  primaTotal: 28274
          perfilRiesgo:
            nivelRiesgo: BAJO
            factores:
              - descripcion: Historial de pagos excelente
                efecto: POSITIVO
                pesoRelativo: 0.1
              - descripcion: Endeudamiento bajo
                efecto: POSITIVO
                pesoRelativo: 0.2
          vigenciaCotizacion:
            desde: '2026-10-06T14:35:00Z'
            hasta: '2026-11-05T14:35:00Z'
          creadaEn: '2026-10-06T14:35:00Z'
      properties:
        estado: { type: string, enum: [VIGENTE, EXPIRADA] }
        producto: { type: string, const: VIDA_HIPOTECARIO }
        datosCredito: { $ref: '#/components/schemas/DatosCredito' }
        origenDatos:
          type: string
          enum: [CONFIRMADO, DECLARADO]
          description: |
            De dónde salen los datos del crédito. `CONFIRMADO`: coinciden exactamente con una
            hipoteca que Open Finance reportó. `DECLARADO`: los escribió el cliente o no hay
            con qué compararlos.
        oferta: { $ref: '#/components/schemas/Oferta' }
        perfilRiesgo:
          oneOf:
            - { $ref: '#/components/schemas/PerfilRiesgo' }
            - type: 'null'
        vigenciaCotizacion: { $ref: '#/components/schemas/Vigencia' }
        creadaEn: { type: string, format: date-time }


    EntidadFinanciera:
      type: object
      additionalProperties: false
      required: [id, nombre]
      properties:
        id: { type: string, examples: [bancolombia] }
        nombre: { type: string, examples: [Bancolombia] }

    CreditoHipotecario:
      type: object
      additionalProperties: false
      required: [entidadNombre, valorCredito, saldoInsoluto, plazoRestanteMeses, cuotaMensual]
      properties:
        entidadId:
          type: string
          description: Entidad del mercado a la que corresponde. Ausente si el banco no está en la lista.
        entidadNombre:
          type: string
          description: Nombre de la entidad para mostrar.
        valorCredito: { type: number, description: Monto total del crédito, en COP. }
        saldoInsoluto: { type: number, description: Saldo a hoy, en COP. }
        plazoRestanteMeses: { type: integer, minimum: 1, description: Meses que faltan. }
        cuotaMensual: { type: number, description: Cuota mensual, en COP. }

    CreditosHipotecarios:
      type: object
      additionalProperties: false
      required: [estado, creditos, entidades, origen]
      properties:
        estado:
          type: string
          enum: [DISPONIBLE, SIN_HIPOTECAS, SIN_CONSENTIMIENTO, NO_DISPONIBLE]
        creditos:
          type: array
          items: { $ref: '#/components/schemas/CreditoHipotecario' }
        entidades:
          type: array
          items: { $ref: '#/components/schemas/EntidadFinanciera' }
          description: Bancos del mercado, en el orden en que se presentan.
        origen:
          type: string
          enum: [OPEN_FINANCE]
        fechaConsulta:
          type: string
          format: date-time
          description: Cuándo se trajeron los datos de la fuente. Ausente si no hay datos.

    TipoEvidencia:
      type: string
      enum: [cedula_frente, cedula_reverso, selfie]
    EstadoVeredicto:
      type: string
      enum: [ACEPTADA, REINTENTAR, REVISION_MANUAL]
    MotivoRechazo:
      type: string
      enum:
        - BORROSA
        - OSCURA
        - REFLEJO
        - RECORTADA
        - NO_ES_CEDULA
        - SIN_ROSTRO
        - VARIOS_ROSTROS
        - POSIBLE_SUPLANTACION
        - NO_COINCIDE_CON_CEDULA
      description: |
        Qué corregir al repetir la foto. `REFLEJO` incluye demasiada luz en toda la foto,
        `BORROSA` incluye una foto con muy pocos píxeles, y `NO_ES_CEDULA` es que no se
        reconoció una tarjeta con la proporción de una cédula.

        Los cuatro últimos son de la selfie: `SIN_ROSTRO` (no se ve un rostro, o se ve muy
        pequeño), `VARIOS_ROSTROS` (hay más de una persona), `POSIBLE_SUPLANTACION` (no parece
        una persona real: foto de una foto o de una pantalla) y `NO_COINCIDE_CON_CEDULA` (el
        rostro no se parece al de la cédula). Los clientes deben tolerar motivos que no
        conozcan.

    SubirEvidenciaRequest:
      type: object
      required: [tipo, imagen]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        imagen: { type: string, format: binary, description: Foto en JPEG o PNG, máximo 3 MB. }

    EvidenciaSubida:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      examples:
        - { evidenciaId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, tipo: cedula_frente, estado: ACEPTADA, motivo: null, intentosRestantes: 3 }
        - { evidenciaId: null, tipo: cedula_reverso, estado: REINTENTAR, motivo: REFLEJO, intentosRestantes: 2 }
      properties:
        evidenciaId:
          type: [string, 'null']
          format: uuid
          description: "`null` con `REINTENTAR`: no se guardó nada."
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { $ref: '#/components/schemas/EstadoVeredicto' }
        motivo:
          oneOf:
            - { $ref: '#/components/schemas/MotivoRechazo' }
            - { type: 'null' }
          description: Solo con `REINTENTAR`.
        intentosRestantes:
          type: integer
          minimum: 0
          description: Rechazos que quedan antes de pasar a revisión manual. Se reinicia al guardar una evidencia.

    EstadoEvidencia:
      type: object
      additionalProperties: false
      required: [tipo, estado, intentosRestantes]
      properties:
        tipo: { $ref: '#/components/schemas/TipoEvidencia' }
        estado: { type: string, enum: [ACEPTADA, REVISION_MANUAL, PENDIENTE] }
        evidenciaId: { type: [string, 'null'], format: uuid }
        creadaEn: { type: [string, 'null'], format: date-time }
        intentosRestantes: { type: integer, minimum: 0 }

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
      examples:
        - type: about:blank
          title: No autorizado
          status: 401
          detail: credenciales inválidas
          instance: https://dev.solventa4bits.com/mobile/v1/sesiones

    ProblemaValidacion:
      description: |
        `Problema` con el detalle campo por campo. Solo lo devuelve la validación
        del esquema de la solicitud (`400`); el resto de errores no lleva `errores`.
      allOf:
        - $ref: '#/components/schemas/Problema'
        - type: object
          properties:
            errores:
              type: array
              items:
                type: object
                properties:
                  campo: { type: string, description: Ruta del campo con error, por ejemplo `body.email`. }
                  mensaje: { type: string }
      examples:
        - type: about:blank
          title: Solicitud inválida
          status: 400
          detail: La solicitud no cumple el esquema
          instance: https://dev.solventa4bits.com/mobile/v1/sesiones
          errores:
            - campo: body.email
              mensaje: String should match pattern '^[^@\s]+@[^@\s]+\.[^@\s]+$'

    RegistrarDispositivoRequest:
      type: object
      additionalProperties: false
      required: [token, plataforma, versionApp]
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 4096
          pattern: ^\S+$
          description: Token de Firebase Cloud Messaging de esta instalación de la app.
        plataforma:
          type: string
          enum: [android]
        versionApp:
          type: string
          minLength: 1
          maxLength: 32
          examples: ['1.0.0']

    Dispositivo:
      type: object
      additionalProperties: false
      required: [dispositivoId]
      properties:
        dispositivoId: { type: string, format: uuid }

    TipoSiniestro:
      type: string
      enum: [INCAPACIDAD_TOTAL, INCENDIO_TERREMOTO, SISMO_PARAMETRICO]
      description: |
        `INCAPACIDAD_TOTAL` es de la cobertura Vida (se paga al banco, sin destino) e
        `INCENDIO_TERREMOTO` de Tu casa (`HOGAR`, con destino del pago y narración).
        `SISMO_PARAMETRICO` lo crea el pago automático por sismo: no se reporta, así que
        `ReportarSiniestroDatos.tipo` no lo admite.

    EstadoSiniestro:
      type: string
      enum: [EN_ESTUDIO, FALTA_INFORMACION, PAGADO, RECHAZADO]

    ArchivoReporte:
      type: object
      additionalProperties: false
      required: [clase]
      description: Datos de un archivo, en el mismo orden que las partes `archivos`.
      properties:
        clase: { type: string, enum: [FOTO, DOCUMENTO] }
        capturadoEn: { type: string, format: date-time }
        latitud:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          description: '`null` si el cliente negó el permiso de ubicación.'
        longitud:
          type: [number, 'null']
          minimum: -180
          maximum: 180

    DestinoPago:
      description: Cómo recibe el pago el cliente. Se guarda tal como llega.
      oneOf:
        - type: object
          additionalProperties: false
          required: [tipo, banco, tipoCuenta, numeroCuenta]
          properties:
            tipo: { type: string, const: TRANSFERENCIA }
            banco: { type: string, minLength: 1, maxLength: 100 }
            tipoCuenta: { type: string, enum: [AHORROS, CORRIENTE] }
            numeroCuenta: { type: string, pattern: '^[0-9]{4,20}$' }
        - type: object
          additionalProperties: false
          required: [tipo, oficina]
          properties:
            tipo: { type: string, const: CHEQUE }
            oficina:
              type: object
              additionalProperties: false
              required: [id, banco, nombre, direccion]
              properties:
                id: { type: string, minLength: 1, maxLength: 64 }
                banco: { type: string, minLength: 1, maxLength: 100 }
                nombre: { type: string, minLength: 1, maxLength: 100 }
                direccion: { type: string, minLength: 1, maxLength: 200 }

    ReportarSiniestroDatos:
      type: object
      additionalProperties: false
      required: [polizaId, tipo, fechaOcurrencia, archivos]
      examples:
        - polizaId: 7c1f6a4e-2b8d-4d3a-9a55-0e3b1f2c8d10
          tipo: INCENDIO_TERREMOTO
          fechaOcurrencia: '2026-11-10'
          narracion: Se incendió la cocina
          archivos:
            - { clase: FOTO, capturadoEn: '2026-11-10T15:02:00Z', latitud: 4.65, longitud: -74.06 }
          destinoPago: { tipo: TRANSFERENCIA, banco: Bancolombia, tipoCuenta: AHORROS, numeroCuenta: '48210012345' }
      properties:
        polizaId: { type: string, minLength: 1, maxLength: 64 }
        tipo:
          type: string
          enum: [INCAPACIDAD_TOTAL, INCENDIO_TERREMOTO]
          description: 'El paramétrico (`SISMO_PARAMETRICO`) lo crea Solventa: no se reporta.'
        fechaOcurrencia: { type: string, format: date }
        narracion:
          type: string
          maxLength: 4000
          description: Obligatoria en `INCENDIO_TERREMOTO`.
        archivos:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ArchivoReporte' }
        destinoPago:
          $ref: '#/components/schemas/DestinoPago'
          description: Obligatorio en `INCENDIO_TERREMOTO`; no puede llegar en `INCAPACIDAD_TOTAL`.

    SiniestroReportado:
      type: object
      additionalProperties: false
      required: [id, numero, estado]
      examples:
        - id: 3f2b8c1e-7d4a-4e5b-9a61-2c8d5f0b7e14
          numero: SIN-2026-7K3M9Q
          estado: EN_ESTUDIO
      properties:
        id: { type: string, format: uuid }
        numero:
          type: string
          description: El radicado que ve el cliente, p. ej. `SIN-2026-7K3M9Q`.
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }

    ProblemaSiniestro:
      allOf:
      - $ref: '#/components/schemas/Problema'
      - type: object
        properties:
          codigo:
            type: string
            enum:
              [FUERA_DE_VIGENCIA, SINIESTRO_EN_CURSO, TIPO_NO_CUBIERTO, ESTADO_NO_PERMITE,
               AYUDA_NO_DISPONIBLE]

    EntregarEvidenciasDatos:
      type: object
      additionalProperties: false
      required: [archivos]
      properties:
        archivos:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ArchivoReporte' }

    ArchivoSiniestro:
      type: object
      additionalProperties: false
      required: [id, clase, entregadoEn]
      properties:
        id: { type: string, format: uuid }
        clase: { type: string, enum: [FOTO, DOCUMENTO] }
        capturadoEn: { type: [string, 'null'], format: date-time }
        latitud: { type: [number, 'null'] }
        longitud: { type: [number, 'null'] }
        entregadoEn:
          type: string
          format: date-time
          description: La fecha de la entrega en que llegó (el reporte o lo que se pidió después).

    EvidenciaPedida:
      type: object
      additionalProperties: false
      required: [detalle, pedidaEn]
      properties:
        detalle: { type: string, description: 'Lo que escribió Solventa, tal cual.' }
        pedidaEn: { type: string, format: date-time }

    LineaPago:
      type: object
      additionalProperties: false
      required: [beneficiario, valor, destino]
      properties:
        beneficiario: { type: string, enum: [BANCO, CLIENTE] }
        valor: { type: number }
        destino:
          type: string
          description: 'Texto listo para mostrar, p. ej. «Cuenta de ahorros terminada en 4821».'

    Pago:
      type: object
      additionalProperties: false
      required: [pagadoEn, lineas]
      description: La orden de pago simulada, una por siniestro, con una o dos líneas.
      properties:
        pagadoEn: { type: string, format: date-time }
        lineas:
          type: array
          items: { $ref: '#/components/schemas/LineaPago' }

    EventoSismo:
      type: object
      additionalProperties: false
      required: [fecha, municipio, magnitud]
      properties:
        fecha: { type: string, format: date }
        municipio: { type: string }
        magnitud: { type: number }

    SiniestroResumen:
      type: object
      additionalProperties: false
      required: [id, numero, polizaId, tipo, automatico, estado, reportadoEn, actualizadoEn]
      examples:
        - id: 3f2b8c1e-7d4a-4e5b-9a61-2c8d5f0b7e14
          numero: SIN-2026-7K3M9Q
          polizaId: 7c1f6a4e-2b8d-4d3a-9a55-0e3b1f2c8d10
          tipo: INCENDIO_TERREMOTO
          automatico: false
          estado: EN_ESTUDIO
          reportadoEn: '2026-11-10T15:02:00Z'
          actualizadoEn: '2026-11-10T15:02:00Z'
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        polizaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoSiniestro' }
        automatico: { type: boolean, description: '`true` en el pago automático por sismo.' }
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }
        reportadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }

    Siniestro:
      type: object
      additionalProperties: false
      required:
        [id, numero, polizaId, tipo, automatico, estado, reportadoEn, actualizadoEn,
         fechaOcurrencia, ultimaEntregaEn, archivos]
      description: |
        El detalle de mi siniestro: los campos del resumen más el plazo, lo que Solventa pidió, el
        motivo del rechazo, la orden de pago y mis archivos.
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        polizaId: { type: string }
        tipo: { $ref: '#/components/schemas/TipoSiniestro' }
        automatico: { type: boolean, description: '`true` en el pago automático por sismo.' }
        estado: { $ref: '#/components/schemas/EstadoSiniestro' }
        reportadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        fechaOcurrencia: { type: string, format: date }
        narracion: { type: [string, 'null'] }
        ultimaEntregaEn: { type: string, format: date-time }
        fechaLimite:
          type: [string, 'null']
          format: date-time
          description: 'Solo en `EN_ESTUDIO`: la última entrega más un mes.'
        evidenciaPedida:
          oneOf:
            - { $ref: '#/components/schemas/EvidenciaPedida' }
            - { type: 'null' }
        motivoRechazo: { type: [string, 'null'] }
        pago:
          oneOf:
            - { $ref: '#/components/schemas/Pago' }
            - { type: 'null' }
        archivos:
          type: array
          items: { $ref: '#/components/schemas/ArchivoSiniestro' }
        evento:
          oneOf:
            - { $ref: '#/components/schemas/EventoSismo' }
            - { type: 'null' }
          description: Solo en el paramétrico.
        asistencias:
          type: array
          items: { $ref: '#/components/schemas/Asistencia' }
          description: Las solicitudes de ayuda en sitio, de la más antigua a la más reciente.

    PrestadorAsistencia:
      type: object
      additionalProperties: false
      required: [id, nombre, direccion, tiempoLlegadaMin]
      properties:
        id: { type: string, minLength: 1, maxLength: 40 }
        nombre: { type: string, minLength: 1, maxLength: 120 }
        direccion: { type: string, minLength: 1, maxLength: 200 }
        tiempoLlegadaMin: { type: integer, minimum: 1, maximum: 1440 }

    PedirAyudaRequest:
      type: object
      additionalProperties: false
      required: [tipo, prestador, origen]
      description: |
        `FOTOS` y `TELEFONO` llevan `latitud` y `longitud`; `DIRECCION` lleva `direccion` y
        `localidad`. Mezclarlos es `400`.
      properties:
        tipo:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,39}$'
          description: El id del tipo de ayuda del catálogo (`tiposAyuda`), p. ej. `plomeria`.
        prestador: { $ref: '#/components/schemas/PrestadorAsistencia' }
        origen: { type: string, enum: [FOTOS, TELEFONO, DIRECCION] }
        latitud: { type: number, minimum: -90, maximum: 90 }
        longitud: { type: number, minimum: -180, maximum: 180 }
        direccion: { type: string, minLength: 1, maxLength: 200 }
        localidad: { type: string, minLength: 1, maxLength: 60 }

    Asistencia:
      type: object
      required: [id, numero, tipo, prestador, tiempoLlegadaMin, origen, solicitadaEn]
      properties:
        id: { type: string }
        numero: { type: string, examples: [ASI-2026-K7M2Q9] }
        tipo: { type: string }
        prestador: { $ref: '#/components/schemas/PrestadorAsistencia' }
        tiempoLlegadaMin: { type: integer, minimum: 1 }
        origen: { type: string, enum: [FOTOS, TELEFONO, DIRECCION] }
        latitud: { type: [number, 'null'] }
        longitud: { type: [number, 'null'] }
        direccion: { type: [string, 'null'] }
        localidad: { type: [string, 'null'] }
        solicitadaEn: { type: string, format: date-time }

    TipoAyuda:
      type: object
      required: [id, nombre, orden]
      properties:
        id: { type: string, examples: [plomeria] }
        nombre: { type: string, examples: [Plomería] }
        orden: { type: integer }

    Localidad:
      type: object
      required: [id, nombre, ciudad, latitud, longitud]
      properties:
        id: { type: string, examples: [usaquen] }
        nombre: { type: string }
        ciudad: { type: string }
        latitud: { type: number }
        longitud: { type: number }

    Prestador:
      type: object
      required: [id, nombre, tipos, localidad, direccion, latitud, longitud, tiempoLlegadaMin]
      properties:
        id: { type: string, examples: [pr-001] }
        nombre: { type: string }
        tipos:
          type: array
          items: { type: string }
        localidad: { type: string, description: 'Id de una de las `localidades`.' }
        direccion: { type: string }
        latitud: { type: number }
        longitud: { type: number }
        tiempoLlegadaMin: { type: integer }

    OficinaBancaria:
      type: object
      required: [id, banco, nombre, direccion, ciudad, latitud, longitud]
      properties:
        id: { type: string }
        banco: { type: string, examples: [Bancolombia] }
        nombre: { type: string }
        direccion: { type: string }
        ciudad: { type: string }
        latitud: { type: number }
        longitud: { type: number }

    CatalogoSiniestros:
      type: object
      required: [mercado, version, tiposAyuda, localidades, prestadores, oficinas]
      properties:
        mercado: { type: string, enum: [CO] }
        version: { type: integer, minimum: 1 }
        tiposAyuda:
          type: array
          items: { $ref: '#/components/schemas/TipoAyuda' }
        localidades:
          type: array
          items: { $ref: '#/components/schemas/Localidad' }
        prestadores:
          type: array
          items: { $ref: '#/components/schemas/Prestador' }
        oficinas:
          type: array
          items: { $ref: '#/components/schemas/OficinaBancaria' }
